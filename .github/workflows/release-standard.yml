name: Build and publish standard Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  standard:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: v2.0.33
      SOURCE_SHA: 4fa7373d33ebcc1cafd6c6b33e5ee543e0fe0709
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4fa7373d33ebcc1cafd6c6b33e5ee543e0fe0709
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Obtain verified public engine and license bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/Alnitak44/Zipora/releases/download/v2.0.33/Zipora-v2.0.33-win-x64-portable.zip' -OutFile portable.zip
          if ((Get-FileHash portable.zip -Algorithm SHA256).Hash -ne 'E06389148D7358135FC399A918C8211B4FDF5EEC7C4FF5B228D165EF02E31FD1') { throw 'Engine bundle checksum mismatch' }
          Expand-Archive portable.zip dependencies
          foreach ($name in @('7z.exe','7z.dll','7z.sfx','7zCon.sfx','readme.txt','License.txt')) {
            Copy-Item -LiteralPath (Join-Path 'dependencies/App/7zip' $name) -Destination 'src/Zipora/7zip'
          }
      - name: Build native Explorer extension from public source
        shell: pwsh
        run: |
          cmake -S src/Zipora.ShellExtension -B src/Zipora.ShellExtension/build -A x64 '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' '-DCMAKE_SHARED_LINKER_FLAGS=uuid.lib'
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build src/Zipora.ShellExtension/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native extension build failed' }
      - name: Publish normal desktop edition
        shell: pwsh
        run: |
          dotnet publish src/Zipora/Zipora.csproj -c Release -r win-x64 --self-contained true '-p:Portable=false' '-p:PublishSingleFile=true' '-p:IncludeNativeLibrariesForSelfExtract=true' '-p:RuntimeFrameworkVersion=8.0.32' '-p:DebugType=embedded' -o artifacts/Zipora-v2.0.33-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Desktop publish failed' }
      - name: Validate desktop mode, native exports and private-service exclusion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assemblyPath = (Resolve-Path 'src/Zipora/bin/Release/net8.0-windows/win-x64/Zipora.dll').Path
          $assembly = [Reflection.Assembly]::LoadFile($assemblyPath)
          $portable = $assembly.GetType('Zipora.Services.AppStorage').GetField('PortableBuild', [Reflection.BindingFlags]'NonPublic,Static').GetRawConstantValue()
          if ($portable) { throw 'Incorrectly built portable mode' }
          $root = (Resolve-Path 'artifacts/Zipora-v2.0.33-win-x64').Path
          foreach ($name in @('Zipora.exe','Zipora.ico','Zipora.ShellExtension.dll','7zip/7z.exe','7zip/7z.dll','7zip/7z.sfx','7zip/License.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $name))) { throw "Missing release component: $name" }
          }
          if (Test-Path -LiteralPath (Join-Path $root 'Data')) { throw 'Normal release must not contain a Data profile' }
          $native = [Runtime.InteropServices.NativeLibrary]::Load((Join-Path $root 'Zipora.ShellExtension.dll'))
          try {
            foreach ($symbol in @('DllGetClassObject','DllCanUnloadNow')) { [void][Runtime.InteropServices.NativeLibrary]::GetExport($native, $symbol) }
          } finally { [Runtime.InteropServices.NativeLibrary]::Free($native) }
          foreach ($file in Get-ChildItem -LiteralPath $root -Recurse -File) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            foreach ($encoding in @([Text.Encoding]::UTF8,[Text.Encoding]::Unicode)) {
              if ($encoding.GetString($bytes) -match 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}') { throw "Credential pattern in $($file.Name)" }
            }
          }
      - name: Add instructions and licenses
        shell: pwsh
        run: |
          $root = 'artifacts/Zipora-v2.0.33-win-x64'
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md -Destination $root
          Copy-Item -LiteralPath 'dependencies/Licenses' -Destination $root -Recurse
          @'
          # Zipora 2.0.33 · Windows x64 普通版

          完整解压到固定目录，双击 Zipora.exe，无需安装 .NET。
          配置及本地密码库保存在当前 Windows 用户的 %APPDATA%/Zipora，不随程序目录移动。
          普通版密码库使用当前 Windows 用户的 DPAPI 保护，不保证换电脑可读。

          已附带从公开源码新编译的 Zipora.ShellExtension.dll 及 Zipora.ico。
          可在设置中启用资源管理器右键菜单，操作时会出现管理员授权提示。
          启用右键集成后不要移动安装目录；搬迁或删除前，请先从设置关闭右键菜单。
          不附带个人密码字典，需要时在 dictionaries 子目录添加自己的 TXT。

          这是纯离线开源版本，不含在线查询、贡献、激活或自动更新。
          源码：https://github.com/Alnitak44/Zipora
          第三方组件保留各自许可证，见 LICENSE、THIRD_PARTY_NOTICES.md、Licenses 和 7zip/License.txt。
          '@ | Set-Content -LiteralPath (Join-Path $root '使用说明.md') -Encoding utf8
      - name: Create and test package
        shell: pwsh
        run: |
          $engine = (Resolve-Path 'src/Zipora/7zip/7z.exe').Path
          Push-Location artifacts/Zipora-v2.0.33-win-x64
          try {
            & $engine a -tzip -mx5 ../Zipora-v2.0.33-win-x64.zip '.\*'
            if ($LASTEXITCODE -ne 0) { throw 'ZIP creation failed' }
          } finally { Pop-Location }
          & $engine t artifacts/Zipora-v2.0.33-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'ZIP integrity test failed' }
          $hash = (Get-FileHash artifacts/Zipora-v2.0.33-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Zipora-v2.0.33-win-x64.zip" | Set-Content artifacts/SHA256SUMS-standard.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: standard-windows-x64
          path: |
            artifacts/Zipora-v2.0.33-win-x64.zip
            artifacts/SHA256SUMS-standard.txt
      - name: Publish standard assets alongside portable edition
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG artifacts/Zipora-v2.0.33-win-x64.zip artifacts/SHA256SUMS-standard.txt --repo Alnitak44/Zipora
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          $body = gh release view $env:RELEASE_TAG --repo Alnitak44/Zipora --json body --jq .body
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release notes' }
          $extra = @'

          ## 补充：Windows x64 普通版
          - 下载 `Zipora-v2.0.33-win-x64.zip`，完整解压后运行根目录 `Zipora.exe`。
          - 默认将设置和密码库保存在当前 Windows 用户的 AppData，与便携版 Data 目录模式不同。
          - 附带从公开源码编译的 Explorer Shell Extension，可在设置中启用系统右键菜单。
          - 普通版、便携版均附带运行库和 7-Zip，均为不含在线服务的离线开源版。
          - 普通版校验值见 `SHA256SUMS-standard.txt`；原便携版和校验文件保留不变。
          - 系统右键菜单的实际注册/卸载仍需在用户电脑授权后验收；CI 仅验证 DLL 可加载及导出符号。
          '@
          ($body + "`n" + $extra) | Set-Content release-notes.md -Encoding utf8
          gh release edit $env:RELEASE_TAG --repo Alnitak44/Zipora --title 'Zipora 2.0.33 · 离线开源版（普通版 / 便携版）' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not update release notes' }
