name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/Zipora/Zipora.csproj -c Release
      - run: dotnet run --project tests/ArchiveOutputPathRegression -- artifacts/output-path-test
